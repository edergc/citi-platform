name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src/
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # This is CI's own throwaway container, not real credentials — never the
          # values in backend/.env. POSTGRES_USER here is the bootstrap superuser for
          # this ephemeral instance (unlike the least-privilege citi_app role in real
          # production), which is what lets the "create the test DB" step below work.
          POSTGRES_USER: citi_app
          POSTGRES_PASSWORD: citi_ci_password
          POSTGRES_DB: citi_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U citi_app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://citi_app:citi_ci_password@localhost:5432/citi_platform
      # Deliberately a DIFFERENT database (not just a different URL string) — see
      # backend/tests/conftest.py, which refuses to run at all if these two match.
      TEST_DATABASE_URL: postgresql+psycopg://citi_app:citi_ci_password@localhost:5432/citi_platform_test
      SECRET_KEY: ci-only-not-a-real-secret
      CONFIG_ENCRYPTION_KEY: feZHWN3Alq0ufIBcuOXfpp6852bawQYwd1ICjgF2m-Y=
      CORS_ORIGINS: '["http://localhost:5190"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create the separate test database
        run: PGPASSWORD=citi_ci_password psql -h localhost -U citi_app -d citi_platform -c "CREATE DATABASE citi_platform_test;"
      - run: pytest -v
